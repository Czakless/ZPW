<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="bg-warning">
        <div class="m-4 bg-primary text-white">m-4: odstęp NA ZEWNĄTRZ niebieskiego pola</div>
    </div>
    <div class="bg-warning">
        <div class="p-1 bg-primary text-white">p-1: odstęp WEWNĄTRZ niebieskiego pola</div>
    </div>

    <!-- mt-mb-3
    margin top - margin bottom - 3
    s - start (lewa, od początku tekstu)
    e - end (prawam koniec tekstu)

    (brak) - wszystkie strony

    x - lewa i prawa
    y - góra i dół 
    
    0-5 + auto 
    
    p-3
    mt-2
    
    mt-md-3
    (odstęp margin/padding)(kierunek) -
    (opcjonalnie rozmiar ekranu) - (wartość)
    sm, md, lg, xl, xxl
    
    Zadanie 1
    pt-4, mx-2, pb-0,me-3,py-md-5,m-lg-auto

    padding top 4
    maring lewoprawo 2
    padding bottom 0
    margin end 3
    padding góra dół medium 5
    margin large auto

    Zadanie 2
    Napisz klase dla opisu: 
    a) margines dolny 24px          class="mb-4"
    b) padding góra i dół 3     class="py-3"
    c) lewy margines 4px       class=""
    d) padding ze wszystkich stron 48px, ale dopiero od laptopa

    Zadanie 3
    Zrób trzy akapity jeden pod drugim, między którymi jest duży odstęp (5), a ostatni akapit nie ma żadnego marginesu dolnego.



    -->

    <div class="container">
        <div class="mb-5">1</div>
        <div class="mb-5">2</div>
        <div class="mb-0">3</div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
